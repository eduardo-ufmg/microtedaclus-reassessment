[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc-shared"
version = "1.0.0"
description = "Code shared by the experiments of the thesis: MicroTEDAClus+, run-level metrics and statistical ingredients."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "numba", "statsmodels"]

[tool.setuptools]
packages = ["pfc_shared"]
